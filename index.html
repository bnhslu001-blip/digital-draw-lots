<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲 Draw Lots — 8 Slots</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; }
    h1 { color: white; margin-bottom: 25px; font-size: 2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
    .container { background: white; border-radius: 24px; padding: 35px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center; max-width: 450px; width: 100%; }
    .wheel-container { position: relative; width: 320px; height: 320px; margin: 0 auto 25px; }
    canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 15px rgba(0,0,0,0.15); }
    .pointer { 
      position: absolute; 
      top: -10px; 
      left: 50%; 
      transform: translateX(-50%); 
      width: 0; 
      height: 0; 
      border-left: 20px solid transparent; 
      border-right: 20px solid transparent; 
      border-top: 40px solid #e74c3c; 
      z-index: 10; 
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }
    button { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; border: none; padding: 14px 40px; font-size: 1.15rem; border-radius: 50px; cursor: pointer; font-weight: bold; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(231,76,60,0.4); }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(231,76,60,0.5); }
    button:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; box-shadow: none; }
    .result { margin-top: 25px; font-size: 1.5rem; font-weight: bold; color: #2c3e50; min-height: 45px; }
    .slots-input { margin-top: 20px; text-align: left; }
    .slots-input label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
    textarea { width: 100%; height: 130px; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 1rem; resize: none; }
    textarea:focus { outline: none; border-color: #667eea; }
    .update-btn { margin-top: 12px; background: #667eea; padding: 9px 20px; font-size: 0.95rem; }
    .debug-info { margin-top: 15px; font-size: 0.85rem; color: #888; background: #f9f9f9; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🎲 Draw Lots — 8 Slots</h1>
  <div class="container">
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="320" height="320"></canvas>
    </div>
    <button id="spinBtn">🎯 SPIN THE WHEEL</button>
    <div class="result" id="result"></div>
    
    <div class="slots-input">
      <label>Edit your 8 items (one per line):</label>
      <textarea id="slotItems">Slot 1
Slot 2
Slot 3
Slot 4
Slot 5
Slot 6
Slot 7
Slot 8</textarea>
      <br>
      <button class="update-btn" id="updateBtn">🔄 Update Wheel</button>
    </div>
    <div class="debug-info" id="debugInfo"></div>
  </div>

  <script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const updateBtn = document.getElementById('updateBtn');
    const resultDisplay = document.getElementById('result');
    const debugInfo = document.getElementById('debugInfo');
    const textarea = document.getElementById('slotItems');
    
    let items = [];
    let rotation = 0;
    let isSpinning = false;
    const colors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#34495e'];
    const SEGMENTS = 8;
    const SLICE_ANGLE = (Math.PI * 2) / SEGMENTS;
    
    function loadItems() {
      items = textarea.value.split('\n').map(s => s.trim()).filter(s => s).slice(0, SEGMENTS);
      while (items.length < SEGMENTS) items.push(`Slot ${items.length+1}`);
    }
    
    function drawWheel() {
      loadItems();
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = Math.min(cx, cy) - 10;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (let i = 0; i < SEGMENTS; i++) {
        // Each segment starts at the TOP and goes clockwise
        const startAngle = rotation + i * SLICE_ANGLE - Math.PI / 2;
        const endAngle = startAngle + SLICE_ANGLE;
        
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = colors[i];
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Draw text in middle of each segment
        const midAngle = startAngle + SLICE_ANGLE / 2;
        ctx.save();
        ctx.translate(
          cx + Math.cos(midAngle) * (r - 35),
          cy + Math.sin(midAngle) * (r - 35)
        );
        ctx.rotate(midAngle + Math.PI / 2);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(items[i], 0, 5);
        ctx.restore();
      }
    }
    
   function getWinner() {
  // Normalize wheel rotation
  const fullCircle = Math.PI * 2;
  const normalized = ((rotation % fullCircle) + fullCircle) % fullCircle;

  // The pointer is at the top (-90 degrees)
  // Find the wheel's segment currently under the pointer
  const pointerAngle = (fullCircle - normalized) % fullCircle;

  const index = Math.floor(pointerAngle / SLICE_ANGLE);

  return index;
    }
    
    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;
      resultDisplay.textContent = '';
      debugInfo.textContent = 'Spinning...';
      
      const duration = 4000;
      const spins = 5 + Math.random() * 4; // 5-9 full rotations
      const totalRotation = spins * Math.PI * 2;
      const startRotation = rotation;
      const startTime = performance.now();
      
      function animate(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        rotation = startRotation + totalRotation * ease;
        
        drawWheel();
        
        if (t < 1) {
          requestAnimationFrame(animate);
        } else {
          const idx = getWinner();
          resultDisplay.innerHTML = `🎉 Winner: <span style="color:#e74c3c; font-size:1.8rem">${items[idx]}</span>`;
          isSpinning = false;
          spinBtn.disabled = false;
        }
      }
      requestAnimationFrame(animate);
    }
    
    spinBtn.addEventListener('click', spinWheel);
    updateBtn.addEventListener('click', () => {
      rotation = 0;
      resultDisplay.textContent = '';
      debugInfo.textContent = '';
      drawWheel();
    });
    
    drawWheel();
  </script>
</body>
</html>
